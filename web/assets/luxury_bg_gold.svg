<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 588" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF7"/>
      <stop offset="50%" stop-color="#F9F6EE"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA7C11"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D23"/>
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#AA7C11" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="damask" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 C25 10 35 15 40 20 C35 25 25 30 20 40 C15 30 5 25 0 20 C5 15 15 10 20 0 Z" fill="none" stroke="#D4AF37" stroke-width="0.3" stroke-opacity="0.12"/>
      <circle cx="20" cy="20" r="1.5" fill="#D4AF37" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#damask)"/>

  <!-- Ornate Outer Border -->
  <rect x="14" y="14" width="372" height="560" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <rect x="19" y="19" width="362" height="550" rx="9" fill="none" stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.6" stroke-dasharray="3,3"/>

  <!-- Inner Soft Inset -->
  <rect x="24" y="24" width="352" height="540" rx="7" fill="url(#softGold)"/>

  <!-- Corner Ornaments (Top-Left) -->
  <g transform="translate(18, 18)">
    <path d="M0,0 L26,0 C18,8 8,18 0,26 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <circle cx="9" cy="9" r="2" fill="#FFFFFF"/>
    <path d="M0,0 L42,0 C32,5 24,12 18,18 C12,24 5,32 0,42 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  </g>

  <!-- Corner Ornaments (Top-Right) -->
  <g transform="translate(382, 18) scale(-1, 1)">
    <path d="M0,0 L26,0 C18,8 8,18 0,26 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <circle cx="9" cy="9" r="2" fill="#FFFFFF"/>
    <path d="M0,0 L42,0 C32,5 24,12 18,18 C12,24 5,32 0,42 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  </g>

  <!-- Corner Ornaments (Bottom-Left) -->
  <g transform="translate(18, 570) scale(1, -1)">
    <path d="M0,0 L26,0 C18,8 8,18 0,26 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <circle cx="9" cy="9" r="2" fill="#FFFFFF"/>
    <path d="M0,0 L42,0 C32,5 24,12 18,18 C12,24 5,32 0,42 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  </g>

  <!-- Corner Ornaments (Bottom-Right) -->
  <g transform="translate(382, 570) scale(-1, -1)">
    <path d="M0,0 L26,0 C18,8 8,18 0,26 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <circle cx="9" cy="9" r="2" fill="#FFFFFF"/>
    <path d="M0,0 L42,0 C32,5 24,12 18,18 C12,24 5,32 0,42 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  </g>

  <!-- Top Center Arch Motif -->
  <g transform="translate(200, 24)">
    <path d="M-40,0 Q0,16 40,0 Q0,8 -40,0 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <circle cx="0" cy="14" r="2" fill="#AA7C11"/>
  </g>

  <!-- Bottom Center Arch Motif -->
  <g transform="translate(200, 564)">
    <path d="M-40,0 Q0,-16 40,0 Q0,-8 -40,0 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <circle cx="0" cy="-14" r="2" fill="#AA7C11"/>
  </g>
</svg>
